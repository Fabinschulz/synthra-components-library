name: Release

on:
  push:
    branches: [master]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="$NAME@$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG já existe"
            exit 0
          fi

          # O registry do npm demora para refletir uma versão recém-publicada.
          # Espera até 5 minutos antes de concluir que ela não foi publicada.
          PUBLISHED=0
          for i in $(seq 1 30); do
            if npm view "$TAG" version > /dev/null 2>&1; then
              PUBLISHED=1
              break
            fi
            echo "Aguardando $TAG aparecer no registry ($i/30)..."
            sleep 10
          done

          if [ "$PUBLISHED" != "1" ]; then
            echo "$TAG ainda não foi publicado"
            exit 0
          fi

          awk -v v="$VERSION" '$0=="## "v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > release-notes.md

          # Marca o commit que introduziu esta versão no package.json, e não o HEAD
          # atual, que pode ser de um push posterior.
          PATTERN="\"version\": \"$VERSION\""
          COMMIT=$(git log -1 --format=%H -S"$PATTERN" -- package.json)
          COMMIT=${COMMIT:-$(git rev-parse HEAD)}

          git tag "$TAG" "$COMMIT"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
